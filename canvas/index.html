<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ABI Mineral — Design Canvas</title>
<link rel="icon" href="data:,">
<style>
  :root{
    --accent:#0d99ff; --bg:#161616; --panel:#1e1e1e; --chrome:#242424;
    --line:#333; --text:#e6e6e6; --muted:#9b9b9b;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--text);font:12px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;overflow:hidden}
  button{font:inherit;color:inherit;background:#2c2c2c;border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
  button:hover{background:#383838}
  button:disabled{opacity:.45;cursor:not-allowed}
  select{font:inherit;color:inherit;background:#2c2c2c;border:1px solid var(--line);border-radius:6px;padding:5px 8px;max-width:260px}
  #app{display:flex;flex-direction:column;height:100%}
  #topbar{min-height:48px;display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--chrome);border-bottom:1px solid var(--line);flex-wrap:wrap}
  #title{font-weight:600;font-size:13px;margin-right:4px;white-space:nowrap}
  #status{font-size:11px;color:var(--muted);white-space:nowrap}
  #topbar .spacer{flex:1}
  .zoomer{display:flex;align-items:center;gap:4px}
  #zoomPct{min-width:56px;text-align:center}
  #stage{position:relative;flex:1;min-height:0;overflow:hidden;cursor:default;background-color:var(--bg);
    background-image:radial-gradient(circle,#2c2c2c 1px,transparent 1px);background-size:24px 24px;touch-action:none}
  #stage.hand{cursor:grab}
  #stage.grabbing,#stage.hand.grabbing{cursor:grabbing}
  #world{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
  .frame{position:absolute;z-index:1}
  .frame-screen{position:relative;background:#fff;overflow:hidden;border-radius:3px;box-shadow:0 0 0 1px #0007;cursor:zoom-in}
  .frame-screen img{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none;user-select:none}
  .frame-screen.asset{background:#262626;display:flex;align-items:center;justify-content:center}
  .frame-screen.asset img{object-fit:contain}
  .frame-label{position:absolute;left:0;bottom:100%;margin-bottom:6px;white-space:nowrap;pointer-events:auto;cursor:pointer;
    font-weight:600;color:#dcdcdc;transform:scale(var(--inv,1));transform-origin:bottom left}
  .frame-label .dims{color:var(--muted);font-weight:400;margin-left:6px}
  .frame:hover .frame-screen{box-shadow:0 0 0 2px var(--accent)}
  .group-title{position:absolute;left:0;pointer-events:none;font-weight:700;font-size:36px;color:#f2f2f2;
    transform:scale(var(--ginv,1));transform-origin:left top;white-space:nowrap}
  .group-title .count{font-size:15px;font-weight:400;color:var(--muted);margin-left:10px}
  .placeholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    padding:20px;text-align:center;background:#f8fafc;border:1px dashed #cbd5e1;color:#334155;font:600 18px/1.35 system-ui,sans-serif}
  .placeholder small{font-size:12px;font-weight:500;color:#64748b}
  #hint{position:absolute;left:12px;bottom:12px;background:#000000c7;color:#cfcfcf;border:1px solid var(--line);
    border-radius:8px;padding:6px 10px;pointer-events:none;max-width:min(78%,720px);z-index:8;font-size:11px}
  #toast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%) translateY(10px);background:var(--accent);color:#fff;
    padding:7px 14px;border-radius:8px;opacity:0;pointer-events:none;transition:.18s;z-index:30;max-width:80%}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #warning{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:620px;background:#2a1c1c;
    border:1px solid #6b2b2b;color:#ffd9d9;padding:16px 18px;border-radius:10px;z-index:30;line-height:1.6}
  #warning code{background:#00000055;padding:1px 5px;border-radius:4px}
  #inspect{position:fixed;inset:0;z-index:100;display:none}
  #inspect.open{display:block}
  .inspect-backdrop{position:absolute;inset:0;background:#000b}
  .inspect-panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,1280px);height:min(90vh,900px);
    background:#1d1d1d;border:1px solid #3a3a3a;border-radius:12px;box-shadow:0 20px 60px #000c;display:flex;flex-direction:column;overflow:hidden}
  .inspect-head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .inspect-head .name{font-weight:700;font-size:14px}
  .inspect-head .meta{color:var(--muted);font-size:11px}
  .inspect-head .spacer{flex:1}
  .inspect-body{flex:1;min-height:0;background:#111;display:flex;align-items:center;justify-content:center;overflow:auto}
  .inspect-body img{max-width:100%;max-height:100%;display:block}
  .inspect-body iframe{width:100%;height:100%;border:0;background:#fff}
  .inspect-foot{display:flex;gap:8px;justify-content:flex-end;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
  .inspect-foot .left{margin-right:auto;display:flex;gap:8px}
  @media (max-width:820px){
    #topbar{gap:6px}
    #title{font-size:12px}
    #hint{display:none}
    .inspect-panel{width:96vw;height:92vh}
  }
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div id="title">Screen Canvas</div>
    <span id="status"></span>
    <select id="groupFilter" title="Filter grup"></select>
    <select id="jump" title="Pilih screen"></select>
    <div class="spacer"></div>
    <div class="zoomer">
      <button id="zoomOut" title="Zoom out">&minus;</button>
      <button id="zoomPct" title="Reset 100%">100%</button>
      <button id="zoomIn" title="Zoom in">+</button>
      <button id="fitBtn" title="Fit semua screen">Fit</button>
    </div>
  </header>
  <div id="stage">
    <div id="world"></div>
    <div id="hint">Klik screen untuk preview &middot; drag untuk pan &middot; Ctrl/⌘ + scroll untuk zoom &middot; 0 = fit &middot; Esc = tutup preview</div>
    <div id="toast"></div>
    <div id="warning" hidden></div>
  </div>
</div>

<div id="inspect">
  <div class="inspect-backdrop" data-close></div>
  <div class="inspect-panel">
    <div class="inspect-head">
      <div>
        <div class="name" id="inspectName">Preview</div>
        <div class="meta" id="inspectMeta"></div>
      </div>
      <div class="spacer"></div>
      <button id="inspectLive">Buka Live</button>
      <button id="inspectDom">Inspect di Canvas</button>
      <button id="inspectCopy">Copy URL</button>
      <button data-close>Tutup</button>
    </div>
    <div class="inspect-body" id="inspectBody"></div>
    <div class="inspect-foot">
      <div class="left"><span class="meta" id="inspectStatus"></span></div>
      <button data-close>Tutup</button>
    </div>
  </div>
</div>

<script>
"use strict";
(function(){
  var GROUP_HEADER = 230, ROW_GAP = 120, GROUP_GAP = 260, FRAME_GAP = 90;
  var FIT_PAD = 110, ZOOM_MIN = 0.01, ZOOM_MAX = 4;
  var stage = document.getElementById('stage');
  var world = document.getElementById('world');
  var statusEl = document.getElementById('status');
  var groupFilter = document.getElementById('groupFilter');
  var jump = document.getElementById('jump');
  var toastEl = document.getElementById('toast');
  var warningEl = document.getElementById('warning');
  var inspectEl = document.getElementById('inspect');
  var inspectBody = document.getElementById('inspectBody');
  var inspectName = document.getElementById('inspectName');
  var inspectMeta = document.getElementById('inspectMeta');
  var inspectStatus = document.getElementById('inspectStatus');
  var cfg = null, ROOT = null;
  var frames = [], frameById = new Map(), groupEls = new Map();
  var scale = 1, tx = 0, ty = 0;
  var activeGroup = 'all';
  var activeScreen = null;
  var liveFrame = null;
  var drag = null;
  var suppressClick = false;
  var CACHE_BUST = Date.now();

  function esc(value){
    return String(value == null ? '' : value).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function clamp(value, min, max){ return Math.max(min, Math.min(max, value)); }
  function toast(message){
    toastEl.textContent = message;
    toastEl.classList.add('show');
    clearTimeout(toast._timer);
    toast._timer = setTimeout(function(){ toastEl.classList.remove('show'); }, 1600);
  }
  function copyText(text){
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ toast('URL disalin'); }, function(){ toast('Gagal menyalin'); });
      return;
    }
    var area = document.createElement('textarea');
    area.value = text; area.style.position = 'fixed'; area.style.left = '-9999px';
    document.body.appendChild(area); area.select();
    try { document.execCommand('copy'); toast('URL disalin'); } catch(e){ toast('Gagal menyalin'); }
    area.remove();
  }
  function rootUrl(path){
    return new URL(path, ROOT).href;
  }
  function previewUrl(screen){
    if (screen.preview) return rootUrl(screen.preview);
    if (screen.type === 'asset') return rootUrl(screen.src);
    return '';
  }
  function liveUrl(screen){
    var url = new URL(screen.src, ROOT);
    url.searchParams.set('v', String(Date.now()));
    return url.href;
  }

  function loadConfig(){
    ROOT = new URL('../', location.href);
    fetch(new URL('screens.json', ROOT), { cache:'no-store' })
      .then(function(response){ if (!response.ok) throw new Error('HTTP ' + response.status); return response.json(); })
      .then(function(data){
        cfg = data;
        document.getElementById('title').textContent = cfg.title || 'Screen Canvas';
        var hash = location.hash.replace(/^#/, '');
        var hashScreen = hash ? screens().find(function(screen){ return screen.id === hash; }) : null;
        buildGroupFilter();
        if (hashScreen){
          activeGroup = hashScreen.group;
          groupFilter.value = activeGroup;
        }
        buildWorld();
        bindControls();
        requestAnimationFrame(function(){
          if (hash && frameById.has(hash)) zoomToScreen(hash, false);
          else fitAll();
        });
      })
      .catch(function(){
        warningEl.hidden = false;
        warningEl.innerHTML = 'Tidak dapat memuat <code>screens.json</code>.<br><br>Jalankan lewat HTTP server, misalnya <code>python3 -m http.server 8000</code>, lalu buka <code>/canvas/</code>.';
      });
  }

  function screens(){
    return (cfg && cfg.screens) || [];
  }

  function visibleScreens(){
    return screens().filter(function(screen){ return activeGroup === 'all' || screen.group === activeGroup; });
  }

  function buildGroupFilter(){
    var counts = {};
    screens().forEach(function(screen){ counts[screen.group] = (counts[screen.group] || 0) + 1; });
    groupFilter.innerHTML = '<option value="all">Semua Screen (' + screens().length + ')</option>';
    (cfg.groups || []).forEach(function(group){
      if (!counts[group.id]) return;
      var option = document.createElement('option');
      option.value = group.id;
      option.textContent = group.name + ' (' + counts[group.id] + ')';
      groupFilter.appendChild(option);
    });
    var saved = '';
    try { saved = localStorage.getItem('canvas.group') || ''; } catch(e){}
    if (saved && (saved === 'all' || counts[saved])) activeGroup = saved;
    else if (counts.penjualan) activeGroup = 'penjualan';
    groupFilter.value = activeGroup;
  }

  function buildWorld(){
    world.innerHTML = '';
    frames = []; frameById.clear(); groupEls.clear();
    var list = visibleScreens();
    var groupOrder = (cfg.groups || []).map(function(group){ return group.id; });
    groupOrder.forEach(function(groupId){
      var members = list.filter(function(screen){ return screen.group === groupId; });
      if (!members.length) return;
      var group = (cfg.groups || []).find(function(item){ return item.id === groupId; }) || { id:groupId, name:groupId };
      var title = document.createElement('div');
      title.className = 'group-title';
      title.innerHTML = '<span class="name"></span><span class="count"></span>';
      title.querySelector('.name').textContent = group.name;
      title.querySelector('.count').textContent = members.length + (members.length === 1 ? ' screen' : ' screen');
      world.appendChild(title);
      groupEls.set(groupId, title);
      members.forEach(function(screen){
        var width = Number(screen.w || cfg.defaultWidth || 1440);
        var height = Number(screen.h || screen.previewH || (screen.type === 'asset' ? 260 : 900));
        var frame = { screen:screen, w:width, h:height, x:0, y:0 };
        var el = document.createElement('div');
        el.className = 'frame';
        el.dataset.id = screen.id;
        var label = document.createElement('div');
        label.className = 'frame-label';
        label.innerHTML = '<span class="name"></span><span class="dims"></span>';
        label.querySelector('.name').textContent = screen.name;
        label.querySelector('.dims').textContent = width + ' × ' + height;
        var wrap = document.createElement('div');
        wrap.className = 'frame-screen' + (screen.type === 'asset' ? ' asset' : '');
        wrap.style.width = width + 'px';
        wrap.style.height = height + 'px';
        var src = previewUrl(screen);
        if (src){
          var img = document.createElement('img');
          img.src = src;
          img.alt = screen.name;
          img.loading = 'lazy';
          img.decoding = 'async';
          img.draggable = false;
          img.addEventListener('error', function(){ showPlaceholder(wrap, screen); });
          wrap.appendChild(img);
        } else {
          showPlaceholder(wrap, screen);
        }
        wrap.addEventListener('click', function(event){
          if (suppressClick) return;
          event.stopPropagation();
          openInspect(screen);
        });
        label.addEventListener('click', function(event){
          event.stopPropagation();
          openInspect(screen);
        });
        el.appendChild(label);
        el.appendChild(wrap);
        world.appendChild(el);
        frame.el = el; frame.wrapEl = wrap; frame.labelEl = label;
        frames.push(frame);
        frameById.set(screen.id, frame);
      });
    });
    layout();
    buildJump();
    statusEl.textContent = list.length + ' screen';
    if (!list.length){
      world.innerHTML = '<div style="position:absolute;left:20px;top:20px;color:#9b9b9b">Tidak ada screen pada grup ini.</div>';
    }
  }

  function showPlaceholder(wrap, screen){
    var box = document.createElement('div');
    box.className = 'placeholder';
    box.innerHTML = '<span></span><small>Preview belum tersedia · klik untuk buka live</small>';
    box.querySelector('span').textContent = screen.name;
    wrap.appendChild(box);
    wrap.addEventListener('click', function(event){
      if (suppressClick) return;
      event.stopPropagation();
      openInspect(screen);
    });
  }

  function buildJump(){
    jump.innerHTML = '<option value="">Jump ke screen…</option>';
    visibleScreens().forEach(function(screen){
      var option = document.createElement('option');
      option.value = screen.id;
      option.textContent = screen.name;
      jump.appendChild(option);
    });
  }

  function layout(){
    if (!cfg) return;
    var rowWidth = Number(cfg.rowWidth) || 6000;
    var y = 0;
    (cfg.groups || []).forEach(function(group){
      var title = groupEls.get(group.id);
      var members = frames.filter(function(frame){ return frame.screen.group === group.id; });
      if (!members.length) return;
      if (title){
        title.style.top = y + 'px';
        title.y = y;
      }
      var rowTop = y + GROUP_HEADER;
      var x = 0, rowHeight = 0;
      members.forEach(function(frame){
        if (x > 0 && x + frame.w > rowWidth){ rowTop += rowHeight + ROW_GAP; x = 0; rowHeight = 0; }
        frame.x = x; frame.y = rowTop;
        x += frame.w + FRAME_GAP;
        rowHeight = Math.max(rowHeight, frame.h);
        frame.el.style.left = frame.x + 'px';
        frame.el.style.top = frame.y + 'px';
      });
      y = rowTop + rowHeight + GROUP_GAP;
    });
    render();
  }

  function allBox(){
    var box = null;
    frames.forEach(function(frame){
      var next = { x:frame.x, y:frame.y, w:frame.w, h:frame.h };
      if (!box) box = next;
      else {
        var x1 = Math.min(box.x, next.x), y1 = Math.min(box.y, next.y);
        var x2 = Math.max(box.x + box.w, next.x + next.w), y2 = Math.max(box.y + box.h, next.y + next.h);
        box = { x:x1, y:y1, w:x2-x1, h:y2-y1 };
      }
    });
    return box;
  }

  function fitBox(box, pad){
    if (!box) return;
    pad = pad || 0;
    var vw = stage.clientWidth, vh = stage.clientHeight;
    var bw = Math.max(1, box.w), bh = Math.max(1, box.h);
    scale = clamp(Math.min((vw - pad*2) / bw, (vh - pad*2) / bh), ZOOM_MIN, ZOOM_MAX);
    tx = (vw - bw*scale) / 2 - box.x*scale;
    ty = (vh - bh*scale) / 2 - box.y*scale;
    render();
  }

  function fitAll(){
    var box = allBox();
    if (box){ box.x = Math.min(box.x, 0); box.y = Math.min(box.y, 0); }
    fitBox(box, FIT_PAD);
  }

  function zoomToScreen(id, setHash){
    var frame = frameById.get(id);
    if (!frame) return;
    fitBox({ x:frame.x, y:frame.y - 30, w:frame.w, h:frame.h + 30 }, 80);
    if (setHash !== false) history.replaceState(null, '', '#' + id);
  }

  function render(){
    world.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')';
    world.style.setProperty('--inv', Math.min(5, 1/scale));
    world.style.setProperty('--ginv', Math.min(3, Math.max(1, 0.55/scale)));
    stage.style.backgroundSize = (24*scale) + 'px ' + (24*scale) + 'px';
    stage.style.backgroundPosition = tx + 'px ' + ty + 'px';
    document.getElementById('zoomPct').textContent = Math.round(scale*100) + '%';
  }

  function zoomAt(x, y, nextScale){
    nextScale = clamp(nextScale, ZOOM_MIN, ZOOM_MAX);
    var wx = (x - tx) / scale;
    var wy = (y - ty) / scale;
    scale = nextScale;
    tx = x - wx*scale;
    ty = y - wy*scale;
    render();
  }

  function bindControls(){
    groupFilter.addEventListener('change', function(){
      activeGroup = groupFilter.value;
      try { localStorage.setItem('canvas.group', activeGroup); } catch(e){}
      buildWorld();
      fitAll();
    });
    jump.addEventListener('change', function(){
      if (!jump.value) return;
      var screen = screens().find(function(item){ return item.id === jump.value; });
      if (screen && activeGroup !== 'all' && screen.group !== activeGroup){ activeGroup = screen.group; groupFilter.value = activeGroup; buildWorld(); }
      zoomToScreen(screen.id);
      jump.value = '';
    });
    document.getElementById('zoomOut').addEventListener('click', function(){ zoomAt(stage.clientWidth/2, stage.clientHeight/2, scale/1.2); });
    document.getElementById('zoomIn').addEventListener('click', function(){ zoomAt(stage.clientWidth/2, stage.clientHeight/2, scale*1.2); });
    document.getElementById('zoomPct').addEventListener('click', function(){ zoomAt(stage.clientWidth/2, stage.clientHeight/2, 1); });
    document.getElementById('fitBtn').addEventListener('click', fitAll);

    stage.addEventListener('wheel', function(event){
      event.preventDefault();
      if (event.ctrlKey || event.metaKey){
        var factor = event.deltaY < 0 ? 1.12 : 1/1.12;
        zoomAt(event.clientX, event.clientY, scale*factor);
      } else {
        tx -= event.deltaX;
        ty -= event.deltaY;
        render();
      }
    }, { passive:false });

    stage.addEventListener('pointerdown', function(event){
      if (event.button !== 0) return;
      if (event.target.closest && event.target.closest('#inspect')) return;
      drag = { x:event.clientX, y:event.clientY, tx:tx, ty:ty, moved:false, captured:false };
      stage.classList.add('grabbing');
    });
    stage.addEventListener('pointermove', function(event){
      if (!drag) return;
      var dx = event.clientX - drag.x, dy = event.clientY - drag.y;
      if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true;
      if (!drag.moved) return;
      if (!drag.captured){
        try { stage.setPointerCapture(event.pointerId); } catch(e){}
        drag.captured = true;
      }
      suppressClick = true;
      tx = drag.tx + dx;
      ty = drag.ty + dy;
      render();
    });
    stage.addEventListener('pointerup', function(event){
      if (drag && drag.moved) suppressClick = true;
      if (drag && drag.captured){ try { stage.releasePointerCapture(event.pointerId); } catch(e){} }
      drag = null;
      stage.classList.remove('grabbing');
      setTimeout(function(){ suppressClick = false; }, 60);
    });
    stage.addEventListener('pointercancel', function(){ drag = null; stage.classList.remove('grabbing'); });

    document.addEventListener('keydown', function(event){
      if (event.target && /INPUT|SELECT|TEXTAREA/.test(event.target.tagName)) return;
      if (event.key === 'Escape'){ closeInspect(); return; }
      if (event.key === '0'){ fitAll(); return; }
      if (event.key === '+' || event.key === '='){ zoomAt(stage.clientWidth/2, stage.clientHeight/2, scale*1.15); }
      if (event.key === '-'){ zoomAt(stage.clientWidth/2, stage.clientHeight/2, scale/1.15); }
    });

    inspectEl.addEventListener('click', function(event){
      if (event.target.closest('[data-close]')) closeInspect();
    });
    document.getElementById('inspectLive').addEventListener('click', function(){
      if (!activeScreen) return;
      window.open(liveUrl(activeScreen), '_blank', 'noopener');
    });
    document.getElementById('inspectDom').addEventListener('click', function(){
      if (!activeScreen) return;
      inspectBody.innerHTML = '';
      liveFrame = document.createElement('iframe');
      liveFrame.src = liveUrl(activeScreen);
      liveFrame.title = activeScreen.name;
      inspectBody.appendChild(liveFrame);
      inspectStatus.textContent = 'Mode live: satu iframe. Gunakan DevTools untuk inspect padding dan komponen.';
    });
    document.getElementById('inspectCopy').addEventListener('click', function(){
      if (activeScreen) copyText(liveUrl(activeScreen));
    });
    window.addEventListener('resize', function(){ render(); });
  }

  function openInspect(screen){
    activeScreen = screen;
    inspectName.textContent = screen.name;
    var group = (cfg.groups || []).find(function(item){ return item.id === screen.group; }) || { name:screen.group };
    inspectMeta.textContent = group.name + ' · ' + (screen.w || cfg.defaultWidth || 1440) + ' × ' + (screen.h || screen.previewH || 900);
    inspectBody.innerHTML = '';
    liveFrame = null;
    var src = previewUrl(screen);
    if (src){
      var img = document.createElement('img');
      img.src = src;
      img.alt = screen.name;
      inspectBody.appendChild(img);
      inspectStatus.textContent = 'Preview statis. Pilih "Inspect di Canvas" atau "Buka Live" untuk memeriksa DOM dan padding.';
    } else {
      inspectStatus.textContent = 'Preview belum tersedia. Gunakan "Inspect di Canvas" atau "Buka Live".';
    }
    inspectEl.classList.add('open');
  }

  function closeInspect(){
    inspectEl.classList.remove('open');
    inspectBody.innerHTML = '';
    liveFrame = null;
    activeScreen = null;
  }

  loadConfig();
})();
</script>
</body>
