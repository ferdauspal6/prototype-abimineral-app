<header class="flow-header no-print">
  <div class="flow-header-inner">
    <a href="index.html" class="flow-brand" aria-label="Kembali ke aplikasi">
      <img src="assets/logo.png" alt="ABI Mineral">
    </a>
    <div class="flow-title">
      <div class="eyebrow">ABI Mineral System</div>
      <h1>Flow Penjualan</h1>
    </div>
    <div class="flow-toolbar">
      <label class="flow-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><use href="#i-search"></use></svg>
        <input id="flowSearch" type="search" placeholder="Cari kartu, rumus, akun..." autocomplete="off">
      </label>
      <select class="flow-select" id="flowView" aria-label="Filter alur">
        <option value="all">Semua Penjualan</option>
        <option value="order">Order</option>
        <option value="delivery">Pengiriman</option>
        <option value="ar">Piutang</option>
        <option value="return">Return</option>
        <option value="accounting">Akuntansi</option>
      </select>
      <button class="flow-btn" id="flowCoaToggle" aria-pressed="false"></button>
      <button class="flow-btn" id="flowReset" title="Kembalikan posisi kartu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><use href="#i-reset"></use></svg>
        <span class="hidden-mobile">Reset</span>
      </button>
      <button class="flow-btn" id="flowPrintBtn" title="Print ringkasan">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><use href="#i-print"></use></svg>
        <span class="hidden-mobile">Print</span>
      </button>
      <a href="index.html" class="flow-btn primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><use href="#i-chevron-right"></use></svg>
        <span class="hidden-mobile">Aplikasi</span>
      </a>
    </div>
  </div>
</header>

<div class="flow-shell" id="flowShell">
  <div class="flow-viewport" id="flowViewport">
    <div class="flow-world" id="flowWorld">
      <div id="flowLanes"></div>
      <svg id="flowEdges" class="flow-svg" aria-hidden="true"></svg>
      <div id="flowNodes"></div>
    </div>
  </div>

  <div class="flow-hint no-print">Drag area kosong untuk geser · Scroll untuk zoom · Klik kartu untuk detail</div>

  <div class="flow-legend no-print" aria-label="Legenda">
    <b>Legenda</b>
    <span class="legend-item"><span class="legend-line"></span>Alur data</span>
    <span class="legend-item"><span class="legend-line reference"></span>Referensi</span>
    <span class="legend-item"><span class="legend-line formula"></span>Rumus</span>
    <span class="legend-item"><span class="legend-line journal"></span>Jurnal</span>
    <span class="legend-item"><span class="legend-dot"></span>Entitas</span>
    <span class="legend-item"><span class="legend-dot formula"></span>Formula</span>
    <span class="legend-item"><span class="legend-dot account"></span>COA</span>
  </div>

  <div class="flow-zoom no-print">
    <button class="flow-btn" id="flowZoomOut" aria-label="Zoom keluar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><use href="#i-minus"></use></svg></button>
    <span class="flow-zoom-label" id="flowZoomLabel">80%</span>
    <button class="flow-btn" id="flowZoomIn" aria-label="Zoom masuk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><use href="#i-plus"></use></svg></button>
    <button class="flow-btn" id="flowFit" aria-label="Fit ke layar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><use href="#i-fit"></use></svg></button>
  </div>

  <aside class="flow-drawer no-print" id="flowDrawer" aria-label="Detail kartu"></aside>
</div>

<div class="flow-modal no-print" id="flowModal" role="dialog" aria-modal="true"></div>
<div class="flow-print" id="flowPrint"></div>

<script src="assets/flow-data.js"></script>
<script src="assets/flow.js"></script>
</body>
</html>
